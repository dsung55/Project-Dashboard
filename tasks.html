<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — Dashboard</title>
  <link rel="stylesheet" href="styles/main.css">
  <script>
    (function() {
      try {
        var cfg = JSON.parse(localStorage.getItem('dashboardTheme') || '{}');
        var theme = cfg.theme || 'system';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = theme === 'dark' || (theme === 'system' && prefersDark);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        var font = localStorage.getItem('dashboardFont') || 'system';
        if (font && font !== 'system') document.documentElement.setAttribute('data-font', font);
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar navigation -->
    <aside class="sidebar">
      <div class="sidebar-logo">Dashboard</div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Projects</a></li>
        <li><a href="tasks.html" class="active">Tasks</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </aside>

    <!-- Main content -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">
          Tasks
          <span class="help-tooltip" data-tip="List of tasks that don't fall into a particular project. Useful for day-to-day tasks"></span>
        </h1>
      </div>

      <!-- Add task input row -->
      <div class="tasks-add-row">
        <input
          class="tasks-add-input"
          type="text"
          id="tasks-add-input"
          placeholder="Add a task…"
          autocomplete="off"
        >
        <button class="btn btn-primary tasks-add-btn" id="tasks-add-btn">Add</button>
      </div>

      <!-- Toolbar: enter grouping (selection) mode -->
      <div class="tasks-toolbar" id="tasks-toolbar">
        <button class="btn btn-secondary" id="tasks-group-btn">Group tasks</button>
      </div>

      <!-- Selection bar: shown while picking tasks to group -->
      <div class="tasks-selection-bar" id="tasks-selection-bar" hidden>
        <span class="tasks-selection-count" id="tasks-selection-count">0 selected</span>
        <div class="tasks-selection-actions">
          <button class="btn btn-secondary" id="tasks-selection-cancel">Cancel</button>
          <button class="btn btn-primary" id="tasks-selection-create" disabled>Create group</button>
        </div>
      </div>

      <!-- Task list — rendered by tasks.js -->
      <ul class="tasks-list" id="tasks-list"></ul>

    </main>
  </div>

  <!-- Move-to-project modal -->
  <div class="modal-overlay" id="modal-move">
    <div class="modal">
      <div class="modal-title">Move to Project</div>
      <p class="text-secondary modal-body-text">
        Choose a project to move this task into. It will be added to that project's task list and removed from here.
      </p>
      <div class="form-group">
        <label class="form-label" for="move-project-select">Project</label>
        <select class="form-select" id="move-project-select"></select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel-move">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-confirm-move">Move</button>
      </div>
    </div>
  </div>

  <!-- Name-the-group modal -->
  <div class="modal-overlay" id="modal-group">
    <div class="modal">
      <div class="modal-title">Name this group</div>
      <div class="form-group">
        <label class="form-label" for="group-name-input">Group name</label>
        <input class="form-input" type="text" id="group-name-input" placeholder="e.g. Errands" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel-group">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-confirm-group">Create group</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="scripts/api.js"></script>
  <script src="scripts/tasks.js"></script>
  <script src="scripts/updater.js"></script>
</body>
</html>
